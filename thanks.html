<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you | Luxury Talk</title>
<meta name="description" content="Put your track on 4 luxury TikTok pages. Top video 8.3M views, 15+ videos over 1M. Packages from 15 USD.">
<meta property="og:title" content="Luxury Talk | TikTok Music Promotion">
<meta property="og:description" content="Your track on luxury TikTok pages. 8.3M views on our top video.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080a;--bg2:#0f0f13;--card:#141419;--line:#24242c;
  --text:#f5f3ee;--muted:#9b978f;--gold:#e2b85c;--gold2:#ffe2a0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.h{font-family:Unbounded,system-ui,sans-serif;letter-spacing:-.02em;line-height:1.05}
.g{background:linear-gradient(100deg,var(--gold),var(--gold2) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:16px 30px;border-radius:14px;font-weight:700;font-size:15px;transition:.2s;white-space:nowrap}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#140f04}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(226,184,92,.35)}
.btn-line{border:1px solid var(--line);background:rgba(255,255,255,.02)}
.btn-line:hover{border-color:var(--gold);color:var(--gold)}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
h2.h{font-size:clamp(28px,4.4vw,48px);margin-bottom:18px}
.lead{color:var(--muted);font-size:17px;max-width:640px}
.center{text-align:center}.center .lead{margin:0 auto}
section{padding:96px 0}
.alt{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

nav{position:sticky;top:0;z-index:20;background:rgba(8,8,10,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{font-family:Unbounded;font-weight:700;font-size:18px;letter-spacing:-.02em}
.logo span{color:var(--gold)}
nav .links{display:flex;gap:30px;font-size:14px;font-weight:600;color:var(--muted)}
nav .links a:hover{color:var(--text)}
nav .btn{padding:11px 20px;font-size:14px;border-radius:12px}
@media(max-width:820px){nav .links{display:none}}

.hero{position:relative;padding:100px 0 70px;text-align:center;overflow:hidden}
.hero:before{content:"";position:absolute;left:50%;top:-260px;width:1100px;height:700px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(226,184,92,.22),transparent);pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:30px}
.dot{width:8px;height:8px;border-radius:50%;background:#3ee07a;box-shadow:0 0 0 4px rgba(62,224,122,.15)}
.hero h1{font-size:clamp(36px,7vw,82px);font-weight:800;max-width:980px;margin:0 auto 26px;position:relative}
.hero p{font-size:clamp(16px,2vw,19px);color:var(--muted);max-width:620px;margin:0 auto 38px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);margin-top:70px;border:1px solid var(--line);border-radius:22px;background:var(--bg2);overflow:hidden}
.kpi{padding:28px 14px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi b{display:block;font-family:Unbounded;font-weight:700;font-size:clamp(24px,3.6vw,40px)}
.kpi span{font-size:13px;color:var(--muted);font-weight:500}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}

.marquee{border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;padding:18px 0;background:var(--bg2)}
.track{display:flex;gap:48px;width:max-content;animation:mq 30s linear infinite;font-family:Unbounded;font-weight:500;font-size:15px;color:var(--muted)}
.track i{color:var(--gold);font-style:normal}
@keyframes mq{to{transform:translateX(-50%)}}



.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:46px}
@media(max-width:899px){.tile.top:first-child{grid-column:span 2;aspect-ratio:4/3}.tile b{font-size:20px}}
@media(min-width:900px){.gal{grid-template-columns:repeat(6,1fr)}.tile.top{grid-column:span 2}}
.tile{position:relative;margin:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);aspect-ratio:3/4;background:var(--card)}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.tile:hover img{transform:scale(1.05)}
.tile figcaption{position:absolute;inset:auto 0 0 0;padding:40px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.tile b{display:block;font-family:Unbounded;font-size:22px}
.tile.top b{font-size:clamp(26px,3vw,40px);color:var(--gold2)}
.tile span{font-size:12px;color:#d6d2ca}
.tile img{object-position:center 30%}
.more{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:14px}
@media(max-width:700px){.more{grid-template-columns:repeat(3,1fr)}}
.more div{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card);text-align:center}
.more b{display:block;font-family:Unbounded;font-size:18px}
.more span{font-size:12px;color:var(--muted)}
.proof{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
@media(max-width:900px){.proof{grid-template-columns:1fr}}
.shot{border-radius:26px;overflow:hidden;border:1px solid var(--line);box-shadow:0 40px 90px rgba(0,0,0,.6);max-width:460px;justify-self:center}
.facts{list-style:none;margin-top:28px;display:grid;gap:12px}
.facts li{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.facts b{font-family:Unbounded;font-size:18px;min-width:104px;color:var(--gold2)}
.facts span{color:var(--muted);font-size:15px}

.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:50px}
@media(max-width:1000px){.plans{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.plans{grid-template-columns:1fr}}
.plan{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 24px;display:flex;flex-direction:column;transition:.2s}
.plan:hover{transform:translateY(-4px);border-color:rgba(226,184,92,.4)}
.plan.hot{border:1.5px solid var(--gold);background:linear-gradient(180deg,rgba(226,184,92,.12),var(--card) 45%)}
.ribbon{position:absolute;top:-13px;left:22px;background:var(--gold);color:#140f04;font-size:11px;font-weight:800;letter-spacing:.06em;padding:5px 12px;border-radius:999px}
.plan h3{font-family:Unbounded;font-weight:600;font-size:17px}
.plan .d{font-size:14px;color:var(--muted);margin:6px 0 22px;min-height:44px}
.price{font-family:Unbounded;font-weight:700;font-size:42px;line-height:1}
.price small{font-family:Manrope;font-size:14px;font-weight:500;color:var(--muted)}
.pack{margin:20px 0 24px;padding:14px 16px;border-radius:14px;background:rgba(226,184,92,.06);border:1px solid rgba(226,184,92,.2);font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pack s{color:var(--muted);margin-right:6px}
.pack b{font-size:18px;color:var(--gold2)}
.save{display:block;font-size:11px;font-weight:800;color:#3ee07a;letter-spacing:.04em}
.plan .btn{margin-top:auto;padding:13px}
.bundle{margin-top:18px;border:1.5px solid var(--gold);border-radius:22px;padding:30px 34px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;background:linear-gradient(100deg,rgba(226,184,92,.16),transparent 70%)}
.bundle h3{font-family:Unbounded;font-size:24px;font-weight:700}
.bundle p{color:var(--muted)}
.bundle .p{font-family:Unbounded;font-weight:700;font-size:44px;color:var(--gold2)}
.bundle .p s{font-size:20px;color:var(--muted);margin-right:10px;font-weight:500}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:50px}
@media(max-width:900px){.steps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.steps{grid-template-columns:1fr}}
.step{padding:28px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.step .k{font-family:Unbounded;font-weight:700;font-size:13px;color:#140f04;background:var(--gold);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:18px}
.step h4{font-size:17px;margin-bottom:6px}
.step p{font-size:14px;color:var(--muted)}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
@media(max-width:900px){.trust{grid-template-columns:1fr}}
.t{padding:30px;border-radius:20px;border:1px solid var(--line);background:var(--card)}
.t .i{font-size:28px;margin-bottom:14px}
.t h4{font-size:18px;margin-bottom:8px}
.t p{font-size:15px;color:var(--muted)}

.faq{max-width:780px;margin:46px auto 0}
details{border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:12px;background:var(--card)}
summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:20px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";color:var(--gold);font-size:22px;line-height:1}
details[open] summary:after{content:"−"}
details p{color:var(--muted);font-size:15px;margin-top:12px}

.final{text-align:center;padding:110px 0;position:relative;overflow:hidden}
.final:before{content:"";position:absolute;left:50%;bottom:-300px;width:1000px;height:600px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(226,184,92,.2),transparent)}
.final h2{max-width:820px;margin:0 auto 18px;position:relative}
.final .lead{margin:0 auto 36px;position:relative}
.final .cta{position:relative}
.form{position:relative;max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px}
@media(max-width:600px){.form{grid-template-columns:1fr;padding:20px}}
.form label{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.form .full{grid-column:1/-1}
.form input,.form select{font:inherit;font-size:15px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;outline:none;width:100%}
.form input:focus,.form select:focus{border-color:var(--gold)}
.form button{border:0;cursor:pointer;font-family:inherit}
.or{position:relative;color:var(--muted);font-size:14px;margin:28px 0 16px}
.btn-tg{background:#229ED9;color:#fff}
.btn-tg:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(34,158,217,.35)}
footer{padding:30px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a:hover{color:var(--gold)}
.sticky{position:fixed;left:12px;right:12px;bottom:12px;z-index:30;display:none;gap:8px}
@media(max-width:720px){.sticky{display:flex}.sticky .btn{flex:1}footer{padding-bottom:90px}}
</style>
</head>
<body>
<section class="final" style="min-height:100vh;display:flex;align-items:center"><div class="wrap">
  <span class="eyebrow">Request sent</span>
  <h2 class="h">Thank you! We got your <span class="g">track</span></h2>
  <p class="lead">We'll reply within 24 hours. Want a faster answer? Message us on Telegram.</p>
  <div class="cta"><a class="btn btn-tg" href="https://t.me/luxurytalk_net">✈ Telegram @luxurytalk_net</a><a class="btn btn-line" href="/">Back to site</a></div>
</div></section>
</body></html>
